# ──────────────────────────────────────────────────────────────────────
# docker-compose.yml – Zplus Calendar
# ──────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: zplus-cal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zplus
      POSTGRES_PASSWORD: zplus_secret_2024
      POSTGRES_DB: zplus_calendar
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zplus -d zplus_calendar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ───────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: zplus-cal-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: zplus
      MONGO_INITDB_ROOT_PASSWORD: zplus_secret_2024
      MONGO_INITDB_DATABASE: zplus_calendar
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: zplus-cal-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Go Fiber) ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zplus-cal-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: zplus
      POSTGRES_PASSWORD: zplus_secret_2024
      POSTGRES_DB: zplus_calendar
      MONGO_URI: mongodb://zplus:zplus_secret_2024@mongo:27017
      MONGO_DB: zplus_calendar
      REDIS_URL: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  # ── Frontend (Next.js) ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zplus-cal-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
